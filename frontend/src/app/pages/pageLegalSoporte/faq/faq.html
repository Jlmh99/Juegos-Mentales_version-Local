<div class="legal-container">
  <div class="legal-card">
    <button class="btn-back" (click)="regresar()">⬅️ Volver</button>
    <h2>❓ Preguntas Frecuentes</h2>

    <div class="faq-item" *ngFor="let item of faqs">
      <button type="button" class="faq-question" (click)="toggleFaq(item)">
        <span>{{ item.pregunta }}</span>
        <span>{{ item.abierta ? '−' : '+' }}</span>
      </button>
      <p class="faq-answer" *ngIf="item.abierta">{{ item.respuesta }}</p>
    </div>
  </div>
</div>
