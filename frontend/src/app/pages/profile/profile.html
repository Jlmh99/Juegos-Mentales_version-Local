<div class="profile-container">
  <div class="profile-card">
    <h2>👤 Mi Perfil (Rol: {{ userRole() }})</h2>
    <button class="btn-back" (click)="regresar()">⬅️ Volver al Inicio</button>

    <div *ngIf="successMessage()" class="alert success">{{ successMessage() }}</div>
    <div *ngIf="errorMessage()" class="alert danger">{{ errorMessage() }}</div>

    <!-- Sección de Actualización de Perfil -->
    <form [formGroup]="profileForm" (ngSubmit)="guardarPerfil()" class="form-section">
      <h3>Datos Generales</h3>
      <div class="form-group">
        <label>Nombre:</label>
        <input type="text" formControlName="nombre" class="form-control">
      </div>
      <div class="form-group">
        <label>Correo Electrónico:</label>
        <input type="email" formControlName="correo" class="form-control">
      </div>
      <button type="submit" [disabled]="profileForm.invalid" class="btn-save">Actualizar Datos</button>
    </form>

    <hr>

    <!-- Sección de Cambio de Contraseña -->
    <form [formGroup]="passwordForm" (ngSubmit)="cambiarPassword()" class="form-section">
      <h3>Cambiar Contraseña</h3>
      <div class="form-group">
        <label>Contraseña Actual:</label>
        <input type="password" formControlName="currentPassword" class="form-control">
      </div>
      <div class="form-group">
        <label>Nueva Contraseña:</label>
        <input type="password" formControlName="newPassword" class="form-control">
        <small class="help-text">Mínimo 8 caracteres, debe contener letras y números.</small>
      </div>
      <button type="submit" [disabled]="passwordForm.invalid" class="btn-lock">Segurizar y Cambiar</button>
    </form>
  </div>
</div>
